[package]
name = "toss"
version = "0.1.0"
edition = "2021"
description = "A fast, beautiful TUI trash manager — FreeDesktop.org compliant"
authors = ["Praveensenpai"]
license = "MIT"

[[bin]]
name = "toss"
path = "src/main.rs"

[dependencies]
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
clap        = { version = "4", features = ["derive"] }
crossterm   = "0.28"
dirs        = "5"
glob        = "0.3"
humansize   = "2"
ratatui     = "0.29"

[profile.release]
opt-level     = 3
strip         = true
lto           = true
codegen-units = 1
